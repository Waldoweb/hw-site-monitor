# Builds the installable zip for a vX.Y.Z tag and publishes it as a GitHub release.
# Sites running Plugin Update Checker pick it up within ~6 hours.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: hw-site-monitor
      MAIN_FILE: hw-site-monitor.php
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the plugin Version header
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^[[:space:]/*#@]*Version:' "$MAIN_FILE" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ "$TAG" != "$HEADER" ]; then
            echo "::error::Tag v$TAG does not match Version: $HEADER in $MAIN_FILE"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Build zip
        run: |
          mkdir -p "build/$SLUG"
          git archive HEAD | tar -x -C "build/$SLUG"
          (cd build && zip -qr "../$SLUG-${GITHUB_REF_NAME#v}.zip" "$SLUG")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b | { grep -v '^Co-Authored-By:' || true; } > notes.md
          gh release create "$GITHUB_REF_NAME" "$SLUG-${GITHUB_REF_NAME#v}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
